name: CI — Krystal Radio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y freecad
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest scikit-learn joblib
      - name: Build drawings
        run: make drawings
      - name: Run backend tests
        run: python -m pytest tests/requirements/ -q
      - name: Upload drawings
        uses: actions/upload-artifact@v4
        with:
          name: drawings
          path: sim/cad/figures/*_GOST.pdf
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: cd frontend && npm ci
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
