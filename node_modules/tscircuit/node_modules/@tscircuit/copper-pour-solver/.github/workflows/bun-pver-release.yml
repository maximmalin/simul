# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Publish to npm
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to recover (for example, v0.0.48)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  UPSTREAM_REPOS: "" # comma-separated list, e.g. "eval,tscircuit,docs"
  UPSTREAM_PACKAGES_TO_UPDATE: "" # comma-separated list, e.g. "@tscircuit/core,@tscircuit/protos"

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install -g pver
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Recover an existing unpublished tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must look like v0.0.48"
            exit 1
          fi

          expected_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$expected_version" ]]; then
            echo "Tag $RELEASE_TAG contains package version $package_version, expected $expected_version"
            exit 1
          fi

          package_name="$(node -p "require('./package.json').name")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published"
            exit 0
          fi

          npm pkg set repository.type=git
          npm pkg set repository.url=git+https://github.com/tscircuit/copper-pour-solver.git
          npm publish --access public

      - name: Create and publish the next release
        if: inputs.release_tag == ''
        run: pver release --no-push-main
        env:
          GITHUB_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}

      - name: Create Pull Request
        if: inputs.release_tag == ''
        id: create-pr
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: bump version"
          title: "chore: bump version"
          body: "Automated package update"
          branch: bump-version-${{ github.run_number }}
          base: main
          token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          committer: tscircuitbot <githubbot@tscircuit.com>
          author: tscircuitbot <githubbot@tscircuit.com>

      - name: Enable auto-merge
        if: inputs.release_tag == '' && steps.create-pr.outputs.pull-request-number != ''
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}

