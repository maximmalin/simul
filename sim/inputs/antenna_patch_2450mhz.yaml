# =============================================================================
# Antenna definition for the SDR direct-conversion receiver.
#
# Adding a new antenna = copy this file, change the numbers.  No code edits.
#   sim/scripts/antenna_fdtd.py sim/inputs/<yourfile>.yaml
#
# Geometry is millimetres; SI constants are used for frequency.
# =============================================================================

name: patch_2450mhz
description: FR-4 microstrip patch element, 2.45 GHz
type: patch

# --- Operating point ---------------------------------------------------------
f0: 2.45e9 # Hz
band: 0.15e9 # Hz, half-width of sweep

# --- Substrate ---------------------------------------------------------------
substrate:
  eps_r: 4.5
  tan_d: 0.02
  thickness_mm: 0.8 # mm, FR-4

# --- Element geometry --------------------------------------------------------
geometry:
  wire_radius_mm: 0.0 # unused for patch
  height_mm: 0.0 # element sits on substrate top surface
  # Probe feed position as a fraction of -L (0.0 = centre, 0.5 = edge).
  #
  # Derived, not guessed. The cavity model gives
  #     R_in(f) = Zc / (2 sin^2(pi f)),  Zc = z0/sqrt(eps_eff) = 24.1 ohm
  # Input resistance RISES as the probe moves toward the centre. A first FDTD
  # run at 0.19 measured 22.2 ohm where the model predicts 38.1, so the model
  # runs 1.71x high here; matching 50 ohm measured needs ~85 ohm predicted,
  # which this curve puts at f ~ 0.125.
  feed_offset_frac: 0.125

  # null = compute W and L from Balanis for f0 on this substrate.
  width_mm: null
  # Balanis gives L = 28.73 mm, which resonated at 2.342 GHz rather than
  # 2.45 GHz. Since f_res is proportional to 1/L, the correction is
  # 28.73 * (2.342/2.45) = 27.46 mm. Probe loading moves resonance as well, so
  # this is one iteration, not a closed form.
  length_override_mm: 27.46

length_solve: auto # auto | manual
length_mm: null

# --- Ground plane ------------------------------------------------------------
ground:
  enabled: true
  margin_mm: 15.0 # plane extends this far beyond element each side

# --- Excitation / mesh -------------------------------------------------------
# cell = lambda/cells_per_wavelength. The 0.8 mm substrate is a material region
# and the patch a PEC sheet snapped by AddEdges2Grid; neither sets the cell size.
simulation:
  # A patch is electrically small with fine features, so it needs far more
  # cells across the box than a dipole. 160 -> ~4 M cells, ~0.5 GB.
  cells_across_box: 160
  max_cells_per_lambda: 100
  mesh_grading: 1.4
  air_mm: 60.0
  air_lambda_min: 0.1
  max_gb: 3.0
  # Cells through the substrate thickness (geometry, not the air mesh).
  substrate_cells: 4
  nr_ts: 40000
  end_criteria: 1.0e-4

# --- Post-processing ---------------------------------------------------------
results:
  points: 401
  search_frac: 0.1
  z0: 50.0
  # FDTD computes this from the NF2FF box (Prad/P_acc). Override with null only
  # if you want to impose a measured/estimated value.
  eta_rad: null
  link:
    g_tx_dbi: 2.0
    g_rx_dbi: 2.0
    p_tx_dbm: 30.0
    nf_db: 3.5
    snr_db: 10.0