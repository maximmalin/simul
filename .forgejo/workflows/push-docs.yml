name: Documentation Push CI

on:
  push:
    branches: [main, docs/*]
    paths:
      - '*.md'
      - 'docs/**'
      - 'README*'

jobs:
  docs-check:
    runs-on: ubuntu-latest
    constraints:
      - cpu-architecture: x86_64
      - memory: 2g
    steps:
      - uses: actions/checkout@v4
      
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-action@v1
        
      - name: Link Check
        run: |
          echo "Checking documentation links"
          npx markdown-link-check README.md 2>/dev/null || echo "No link checker found"
          
      - name: Build Docs
        run: |
          echo "Building documentation"
          
      - name: Publish Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/
          
      - name: Tag Documentation
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Documentation updated for v${{ github.run_number }}"
          
      - name: Generate Change Log
        if: always()
        run: |
          echo "Generating changelog from commits"
          git log --oneline --no-merges > CHANGELOG.md.tmp