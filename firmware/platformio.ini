[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
build_flags =
    -D USB_CON
    -D USB_CDC
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D PIO_FRAMEWORK_ARDUINO_USB_CDC
monitor_speed = 115200
monitor_port = /dev/ttyACM0

[platformio]
src_dir = src
build_dir = .pio/build
lib_dir = lib