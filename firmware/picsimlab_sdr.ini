; PICSimLab configuration for the SDR direct-conversion receiver co-simulation.
;
; Launch with:
;     picsimlab -p ~/.picsimlab_sdr.ini     (or copy over ~/.picsimlab/picsimlab.ini)
; Then Tools -> Remote Control must be enabled; the port below is where the
; wrapper connects.
;
; The STM32 Blue Pill is loaded with firmware/src/firmware.ino, built via
; PlatformIO. Load the resulting firmware.hex before starting the simulation.

picsimlab_lab		= "Blue_Pill"
picsimlab_debug		= "0"
picsimlab_debugt	= "1"
picsimlab_debugp	= "1237"
picsimlab_remotecp	= "5000"
picsimlab_position	= "97,53"
picsimlab_scale		= "0.995025"

; no oscilloscope / spare parts needed for the co-simulation
osc_on			= "0"
spare_on		= "0"

picsimlab_lpath		= "/home/mirrage/Desktop/кристалл-радио/firmware"
picsimlab_lfile		= "firmware.hex"

; --- Blue Pill = STM32F103C8T6 (PicSimLab board name is Blue_Pill) -----------------------------------------------------------
Blue_Pill_proc	= "STM32F103C8"
Blue_Pill_clock	= "72.0"
Blue_Pill_icount	= "-1"
Blue_Pill_cfgeserial	= "0"
Blue_Pill_cfgewifi	= "0"
Blue_Pill_cfgdwdt	= "0"
Blue_Pill_cfgeeth	= "0"
Blue_Pill_cfgwgdb	= "0"
Blue_Pill_cfguextra	= "0"
Blue_Pill_cmdextra	= " "

; --- co-simulation pins ------------------------------------------------------
; PA0/PA1 are the ADC inputs the mixer chain drives; PA6 is the mixer LO.
; The wrapper maps these through pin_mapper.STM32_BLUE_PILL.
ADC_I_PIN		= "PA0"
ADC_Q_PIN		= "PA1"
LO_PIN			= "PA6"
GAIN_PIN		= "PA7"