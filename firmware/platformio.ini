[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
build_flags =
    -D USB_CON
    -D USB_CDC
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D PIO_FRAMEWORK_ARDUINO_USB_CDC
monitor_speed = 115200
monitor_port = /dev/ttyACM0

; PICSimLab's `loadhex` wants an Intel HEX image, which this target does not
; emit by default (only .bin/.elf). scripts/hex.py adds it via objcopy.
extra_scripts = post:scripts/hex.py

; Co-simulation build: identical firmware with USB CDC compiled out.
;
; Serial.begin() blocks until a USB host enumerates, and qemu-system-arm's
; netduinoplus2 has no USB device model, so under co-simulation setup() never
; returns and loop() never runs. COSIM_MODE skips USB so the main loop runs and
; the RAM mailbox in src/cosim.h is serviced.
;
; Deliberately a separate environment: putting COSIM_MODE in the default build
; would make the USB-less image the one that gets flashed onto a bench.
[env:cosim]
platform = ststm32
board = bluepill_f103c8
framework = arduino
build_flags =
    -D COSIM_MODE
extra_scripts = post:scripts/hex.py

[platformio]
src_dir = src
build_dir = .pio/build
lib_dir = lib
; `pio run` should produce the .hex too, not only `pio run -t hex`.
